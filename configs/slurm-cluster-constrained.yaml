# Slurm Cluster — Constrained Resources (Autoscaling Demo Part 1)
#
# Deploys a Slurm cluster with deliberately undersized worker pods to
# demonstrate resource exhaustion. The "medium" intensity DDP workload
# (~1.5 GB host RAM) will OOM-kill pods limited to 1Gi.
#
# Usage:
#   oc apply -f configs/slurm-cluster-constrained.yaml
#
# To revert to production resources:
#   oc apply -f configs/slurm-cluster.yaml

# Controller (unchanged — controller doesn't run workloads)
apiVersion: slinky.slurm.net/v1beta1
kind: Controller
metadata:
  name: slurm
  namespace: slurm
spec:
  jwtHs256KeyRef:
    name: slurm-auth-jwths256
    key: jwt_hs256.key
  slurmKeyRef:
    name: slurm-auth-slurm
    key: slurm.key
  slurmctld:
    image: 'ghcr.io/slinkyproject/slurmctld:25.11-ubuntu24.04'
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "4"
        memory: "8Gi"
  persistence:
    enabled: true
    resources:
      requests:
        storage: 4Gi
    accessModes:
      - ReadWriteOnce
  reconfigure:
    image: 'ghcr.io/slinkyproject/slurmctld:25.11-ubuntu24.04'
    resources: {}
  logfile:
    image: 'docker.io/library/alpine:latest'
    resources: {}
  extraConf: |
    PartitionName=all Nodes=ALL Default=YES MaxTime=UNLIMITED State=UP
    MinJobAge=3600
---
# NodeSet — CONSTRAINED RESOURCES
#
# Key changes from slurm-cluster.yaml:
#   - memory requests: 2Gi  -> 500Mi
#   - memory limits:   4Gi  -> 1Gi
#   - replicas:        2    -> 2 (kept low)
#
# The 1Gi memory limit is intentionally too small for the medium-intensity
# DDP workload, which pre-allocates ~1.1 GB of training data in RAM plus
# ~400 MB for PyTorch and the model. The pod will be OOMKilled.
apiVersion: slinky.slurm.net/v1beta1
kind: NodeSet
metadata:
  name: slurm-worker-slinky
  namespace: slurm
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: slurm
    app.kubernetes.io/version: '25.11'
    helm.sh/chart: slurm-0.4.1
    nodeset.slinky.slurm.net/name: slurm-worker-slinky
spec:
  controllerRef:
    name: slurm
    namespace: slurm
  replicas: 2
  partition:
    enabled: true
  slurmd:
    image: 'ghcr.io/slinkyproject/slurmd:25.11-ubuntu24.04'
    resources:
      requests:
        cpu: "1"
        memory: "500Mi"
        nvidia.com/gpu: "1"
      limits:
        cpu: "2"
        memory: "1Gi"
        nvidia.com/gpu: "1"
    env:
      - name: POD_CPUS
        value: '0'
      - name: POD_MEMORY
        value: '0'
  logfile:
    image: 'docker.io/library/alpine:latest'
    resources: {}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: slurm
        app.kubernetes.io/version: '25.11'
        helm.sh/chart: slurm-0.4.1
        nodeset.slinky.slurm.net/name: slurm-worker-slinky
    spec:
      affinity: {}
      hostname: slinky-
      imagePullSecrets: null
      initContainers: []
      nodeSelector:
        kubernetes.io/os: linux
        nvidia.com/gpu.present: "true"
      priorityClassName: null
      tolerations:
        - key: g5-gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: g6e-gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      volumes: []
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 100%
    type: RollingUpdate
