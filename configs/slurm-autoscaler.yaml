# Slurm NodeSet Autoscaler — Scale-Down Watchdog + Worker Provisioner
#
# Monitors idle workers and scales the NodeSet back to MIN_REPLICAS when
# no jobs are running. Also provisions PyTorch on newly scaled-up workers.
#
# How it works:
#   1. Every POLL_INTERVAL seconds, exec into slurmctld and run `squeue`
#   2. If no pending/running jobs for SCALE_DOWN_DELAY seconds, scale down
#   3. After any scale-up (triggered externally by `ddp_test.py --launch`),
#      detect new pods and provision them with PyTorch + training scripts
#   4. The Slinky operator handles pod lifecycle (drain before scale-in)
#
# Scaling behavior:
#   Scale-UP:   Handled by `python demos/ddp_test.py --launch` (not this watchdog)
#   Scale-DOWN: No jobs for SCALE_DOWN_DELAY seconds → scale toward MIN_REPLICAS
#   Never scales below MIN_REPLICAS or above MAX_REPLICAS
#
# Prerequisites:
#   - Slurm cluster deployed (Controller + NodeSet)
#   - The autoscaler pod must be schedulable (runs on any linux node)
#
# Deploy (one command):
#   ./scripts/deploy-autoscale.sh
#
# Deploy (manual alternative):
#   1. Create the ConfigMap from script files:
#      oc create configmap slurm-autoscaler-script -n slurm \
#        --from-file=autoscaler.sh=scripts/autoscaler-loop.sh \
#        --from-file=ddp_test.py=demos/ddp_test.py \
#        --dry-run=client -o yaml | oc apply -f -
#
#   2. Apply RBAC + Deployment:
#      oc apply -f configs/slurm-autoscaler.yaml
#
# Remove:
#   oc delete -f configs/slurm-autoscaler.yaml
#   oc delete configmap slurm-autoscaler-script -n slurm

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slurm-autoscaler
  namespace: slurm

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: slurm-autoscaler
  namespace: slurm
rules:
  - apiGroups: ["slinky.slurm.net"]
    resources: ["nodesets", "nodesets/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: slurm-autoscaler
  namespace: slurm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: slurm-autoscaler
subjects:
  - kind: ServiceAccount
    name: slurm-autoscaler
    namespace: slurm

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slurm-autoscaler
  namespace: slurm
  labels:
    app.kubernetes.io/name: slurm-autoscaler
    app.kubernetes.io/part-of: slurm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slurm-autoscaler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slurm-autoscaler
        app.kubernetes.io/part-of: slurm
    spec:
      serviceAccountName: slurm-autoscaler
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: autoscaler
          image: bitnami/kubectl:latest
          command: ["/bin/sh", "/scripts/autoscaler.sh"]
          env:
            - name: NAMESPACE
              value: "slurm"
            - name: NODESET
              value: "slurm-worker-slinky"
            - name: CONTROLLER_POD
              value: "slurm-controller-0"
            - name: MIN_REPLICAS
              value: "2"
            - name: MAX_REPLICAS
              value: "8"
            - name: POLL_INTERVAL
              value: "30"
            - name: SCALE_DOWN_DELAY
              value: "300"
            - name: PYTORCH_INDEX
              value: "https://download.pytorch.org/whl/cu124"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: scripts
          configMap:
            name: slurm-autoscaler-script
            defaultMode: 0755
