# First, create the required secrets (operator default names/keys):
# oc create namespace slurm
# JWT_KEY=$(openssl rand -base64 32)
# SLURM_KEY=$(openssl rand -base64 32)
# oc create secret generic slurm-auth-jwths256 -n slurm --from-literal=jwt_hs256.key="$JWT_KEY"
# oc create secret generic slurm-auth-slurm -n slurm --from-literal=slurm.key="$SLURM_KEY"

# Controller (Slurm Controller)
# Note: Requires jwtHs256KeyRef and slurmKeyRef
# Note: Include image field - operator may not set it automatically
# Note: Resources go in spec.slurmctld.resources, NOT spec.resources
apiVersion: slinky.slurm.net/v1beta1
kind: Controller
metadata:
  name: slurm
  namespace: slurm
spec:
  jwtHs256KeyRef:
    name: slurm-auth-jwths256
    key: jwt_hs256.key
  slurmKeyRef:
    name: slurm-auth-slurm
    key: slurm.key
  slurmctld:
    image: 'ghcr.io/slinkyproject/slurmctld:25.11-ubuntu24.04'
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "4"
        memory: "8Gi"
  persistence:
    enabled: true
    resources:
      requests:
        storage: 4Gi
    accessModes:
      - ReadWriteOnce
  reconfigure:
    image: 'ghcr.io/slinkyproject/slurmctld:25.11-ubuntu24.04'
    resources: {}
  logfile:
    image: 'docker.io/library/alpine:latest'
    resources: {}
  # gres.conf declares the GPU via a static device File= mapping (this
  # slurmd image has no NVML plugin compiled in, so AutoDetect=nvml always
  # reports 0 GPUs regardless of the driver being present).
  configFileRefs:
    - name: slurm-gres-conf
  # NOTE: GresTypes=gpu is intentionally NOT set here — the operator's base
  # template already declares it, and repeating it here caused Slurm's GRES
  # accounting to double up ("GresTypes 1 specified more than once").
  #
  # NOTE: no static `NodeName=slinky-[0-7] Gres=gpu:1` line here on purpose.
  # Workers run `slurmd -Z` (dynamic node registration) — combining that with
  # a static, pre-declared NodeName range for the same hostnames causes
  # slurmd to log "Duplicated NodeHostName" on every boot and register as
  # DOWN+INVALID_REG ("gres/gpu count reported lower than configured"),
  # because the static declaration's implicit Gres expectation conflicts
  # with the node's own dynamic self-registration. With `-Z`, each node
  # reports its own CPUs/memory/GRES (from gres.conf) at registration time,
  # so a static NodeName/Gres declaration for the same nodes isn't needed
  # and isn't safe to combine.
  extraConf: |
    PartitionName=all Nodes=ALL Default=YES MaxTime=UNLIMITED State=UP
    MinJobAge=3600
---
# NodeSet (Compute Nodes) - Note: requires controllerRef
# IMPORTANT: Include image field - operator may not set it automatically
# IMPORTANT: Resources go in spec.slurmd.resources (like Controller uses spec.slurmctld.resources)
apiVersion: slinky.slurm.net/v1beta1
kind: NodeSet
metadata:
  name: slurm-worker-slinky
  namespace: slurm
  labels:
    app.kubernetes.io/part-of: slurm
    app.kubernetes.io/version: '25.11'
    nodeset.slinky.slurm.net/name: slurm-worker-slinky
spec:
  controllerRef:
    name: slurm
    namespace: slurm
  replicas: 2
  partition:
    enabled: true
  slurmd:
    image: 'ghcr.io/slinkyproject/slurmd:25.11-ubuntu24.04'
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
        nvidia.com/gpu: "1"
      limits:
        cpu: "2"
        memory: "4Gi"
        nvidia.com/gpu: "1"
    env:
      - name: POD_CPUS
        value: '0'
      - name: POD_MEMORY
        value: '0'
      # Lets the pre-installed torch (installed by the init container below into
      # a shared emptyDir, since init/main containers don't share a filesystem)
      # be importable by slurmd's python3 without a separate provisioning step.
      - name: PYTHONPATH
        value: '/opt/pydeps'
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
      - name: pydeps
        mountPath: /opt/pydeps
      - name: worker-scripts
        mountPath: /tmp/ddp_test.py
        subPath: ddp_test.py
  logfile:
    image: 'docker.io/library/alpine:latest'
    resources: {}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: slurm
        app.kubernetes.io/version: '25.11'
        nodeset.slinky.slurm.net/name: slurm-worker-slinky
    spec:
      serviceAccountName: slurm-workload
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 90
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: In
                    values: ["true"]
      hostname: slinky-
      imagePullSecrets: null
      # Runs BEFORE slurmd starts, so slurmd (and therefore the Slurm
      # controller) never sees this node as available until PyTorch is
      # actually importable. This is what makes autoscaling safe for any
      # job: a freshly scaled-up node cannot be scheduled onto while it is
      # still provisioning, and Kubernetes runs one of these per pod, so
      # scaling up by several nodes at once provisions them all in parallel
      # instead of one at a time.
      initContainers:
        - name: provision-pytorch
          image: 'ghcr.io/slinkyproject/slurmd:25.11-ubuntu24.04'
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              if [ -f /opt/pydeps/.installed ]; then
                echo "PyTorch already present in shared volume, skipping install"
                exit 0
              fi
              echo "Installing PyTorch into /opt/pydeps..."
              apt-get update -qq
              apt-get install -y -qq python3-pip
              pip3 install --break-system-packages --target=/opt/pydeps \
                torch --index-url "${PYTORCH_INDEX}"
              touch /opt/pydeps/.installed
              echo "PyTorch install complete"
          env:
            - name: PYTORCH_INDEX
              value: 'https://download.pytorch.org/whl/cu124'
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: pydeps
              mountPath: /opt/pydeps
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: null
      tolerations:
        # Standard NVIDIA GPU Operator taint. Adapt to your cluster's GPU taint scheme.
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        # Cluster-specific: AWS g5 and g6e instance family taints
        - key: g5-gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: g6e-gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        # Shared between the init container and slurmd so packages installed
        # before slurmd starts are importable at runtime (init and main
        # containers do not otherwise share a filesystem).
        - name: pydeps
          emptyDir: {}
        # Training script(s), baked in at deploy time (see deploy-slurm.sh)
        # so every worker — including ones created by the autoscaler — has
        # them immediately, with no runtime copy step required.
        - name: worker-scripts
          configMap:
            name: slurm-worker-scripts
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 100%
    type: RollingUpdate
