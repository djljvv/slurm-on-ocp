# First, create the required secrets (operator default names/keys):
# oc create namespace slurm
# JWT_KEY=$(openssl rand -base64 32)
# SLURM_KEY=$(openssl rand -base64 32)
# oc create secret generic slurm-auth-jwths256 -n slurm --from-literal=jwt_hs256.key="$JWT_KEY"
# oc create secret generic slurm-auth-slurm -n slurm --from-literal=slurm.key="$SLURM_KEY"

# Controller (Slurm Controller)
# Note: Requires jwtHs256KeyRef and slurmKeyRef
# Note: Include image field - operator may not set it automatically
# Note: Resources go in spec.slurmctld.resources, NOT spec.resources
apiVersion: slinky.slurm.net/v1beta1
kind: Controller
metadata:
  name: slurm
  namespace: slurm
spec:
  jwtHs256KeyRef:
    name: slurm-auth-jwths256
    key: jwt_hs256.key
  slurmKeyRef:
    name: slurm-auth-slurm
    key: slurm.key
  slurmctld:
    image: 'ghcr.io/slinkyproject/slurmctld:25.11-ubuntu24.04'
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "4"
        memory: "8Gi"
  persistence:
    enabled: true
    resources:
      requests:
        storage: 4Gi
    accessModes:
      - ReadWriteOnce
  reconfigure:
    image: 'ghcr.io/slinkyproject/slurmctld:25.11-ubuntu24.04'
    resources: {}
  logfile:
    image: 'docker.io/library/alpine:latest'
    resources: {}
  extraConf: |
    PartitionName=all Nodes=ALL Default=YES MaxTime=UNLIMITED State=UP
    MinJobAge=3600
    GresTypes=gpu
---
# NodeSet (Compute Nodes) - Note: requires controllerRef
# IMPORTANT: Include image field - operator may not set it automatically
# IMPORTANT: Resources go in spec.slurmd.resources (like Controller uses spec.slurmctld.resources)
apiVersion: slinky.slurm.net/v1beta1
kind: NodeSet
metadata:
  name: slurm-worker-slinky
  namespace: slurm
  labels:
    app.kubernetes.io/part-of: slurm
    app.kubernetes.io/version: '25.11'
    nodeset.slinky.slurm.net/name: slurm-worker-slinky
spec:
  controllerRef:
    name: slurm
    namespace: slurm
  replicas: 2
  partition:
    enabled: true
  slurmd:
    image: 'ghcr.io/slinkyproject/slurmd:25.11-ubuntu24.04'
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
        nvidia.com/gpu: "1"
      limits:
        cpu: "2"
        memory: "4Gi"
        nvidia.com/gpu: "1"
    env:
      - name: POD_CPUS
        value: '0'
      - name: POD_MEMORY
        value: '0'
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm
  logfile:
    image: 'docker.io/library/alpine:latest'
    resources: {}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: slurm
        app.kubernetes.io/version: '25.11'
        nodeset.slinky.slurm.net/name: slurm-worker-slinky
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 90
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: In
                    values: ["true"]
      hostname: slinky-
      imagePullSecrets: null
      initContainers: []
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: null
      tolerations:
        # Standard NVIDIA GPU Operator taint. Adapt to your cluster's GPU taint scheme.
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        # Cluster-specific: AWS g5 and g6e instance family taints
        - key: g5-gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: g6e-gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 100%
    type: RollingUpdate
